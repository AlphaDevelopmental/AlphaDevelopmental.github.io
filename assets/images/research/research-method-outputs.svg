.box-ok{fill:#12313a;stroke:#6fd39a;stroke-width:1.4}
.box-bad{fill:#3a1f2a;stroke:#ff8f86;stroke-width:1.4}
.box-muted{fill:none;stroke:#7f93ad;stroke-width:1.2;stroke-dasharray:5 4}
.zone{fill:rgba(224,181,58,.05);stroke:#e0b53a;stroke-width:1.3;stroke-dasharray:6 5}
.t{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#f3f6fb}
.ts{font:500 12px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:#b8c7db}
.cap{font:600 11.5px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:#e0b53a;letter-spacing:.04em}
.ok{fill:#6fd39a}.bad{fill:#ff8f86}.gold{fill:#e0b53a}.dim{fill:#a0aec2}.blue{fill:#9cc0ea}
.ln{stroke:#9cc0ea;stroke-width:1.6;fill:none}
.ln-ok{stroke:#6fd39a;stroke-width:1.6;fill:none}
.ln-bad{stroke:#ff8f86;stroke-width:1.6;fill:none}
.ln-gold{stroke:#e0b53a;stroke-width:1.6;fill:none}
</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d">
<title id="t">From investigation to curriculum</title>
<desc id="d">The research method: investigate how a real system fails, reproduce it in a controlled lab, document the evidence and its limits, then teach it. These stages produce technical investigations, research prototypes and laboratory demonstrations. No peer-reviewed publication is listed at present.</desc>

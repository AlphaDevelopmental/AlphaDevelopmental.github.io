<text x="30" y="61" class="t" text-anchor="start">Browser</text>
<text x="332" y="61" class="ts" text-anchor="end">origin &amp; cookies</text>
<rect x="356" y="44" width="40" height="24" rx="12" fill="rgba(224,181,58,.14)" stroke="#e0b53a"/>

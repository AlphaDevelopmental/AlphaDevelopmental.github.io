<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d">
<title id="t">Where the research areas sit in a web system</title>
<desc id="d">A layered map of a web system from the browser down to the build pipeline. R3 CORS and same-origin policy sit at the browser; R4 JWT security at the token; R2 authentication and authorisation at access checks; R1 web and API security at the application; R7 AI security at LLM and agent tools; R6 DevSecOps at the build pipeline. R5 security automation probes the system from outside, and R8 education turns each layer into a lab.</desc>

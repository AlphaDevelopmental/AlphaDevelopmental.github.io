<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" aria-hidden="true">
  <!-- Neutral portrait placeholder: abstract artwork, deliberately not a likeness. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1d3a61"/>
      <stop offset="0.55" stop-color="#142b4a"/>
      <stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0b53a"/>
      <stop offset="1" stop-color="#c99700"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.5">
      <stop offset="0" stop-color="#e0b53a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e0b53a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e5edf7" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <circle cx="400" cy="360" r="250" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="400" cy="360" r="190" stroke-opacity="0.32" stroke-width="2" stroke-dasharray="4 10"/>
    <path d="M400 110a250 250 0 0 1 216 125" stroke-width="5" stroke-opacity="0.85"/>
    <path d="M184 485a250 250 0 0 1 -34 -125" stroke-width="5" stroke-opacity="0.55"/>
  </g>
  <rect x="300" y="260" width="200" height="200" rx="46" fill="#0e1f37" stroke="url(#gold)" stroke-width="5"/>
  <text x="400" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="600" fill="url(#gold)">&#945;</text>
</svg>

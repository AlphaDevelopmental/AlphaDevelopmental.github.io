<text x="16" y="26" class="cap" text-anchor="start">EVERY LAB, THE SAME LOOP</text>
<rect class="box-bad" x="16" y="50" width="136" height="62" rx="8"/>
<text x="84.0" y="78.0" class="t" text-anchor="middle">1 · Attack</text>
<text x="84.0" y="95.0" class="ts" text-anchor="middle">exploit the flaw</text>
<path class="ln-gold" d="M152 81H168" marker-end="url(#agold)"/>
<rect class="box-gold" x="172" y="50" width="136" height="62" rx="8"/>

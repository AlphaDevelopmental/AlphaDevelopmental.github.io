<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img" aria-labelledby="t d">
<title id="t">Teaching loop: attack, explain, fix</title>
<desc id="d">Each lab follows the same loop: learners attack a deliberately vulnerable system, explain the root cause in code, then fix it and re-test.</desc>
<style>
.bg{fill:#0e1f37}.grid{stroke:#e5edf7;stroke-opacity:.045;stroke-width:1}
.box{fill:#142b4a;stroke:#47658c;stroke-width:1.3}
.box-gold{fill:#142b4a;stroke:#e0b53a;stroke-width:1.5}
.box-ok{fill:#12313a;stroke:#6fd39a;stroke-width:1.4}
.box-bad{fill:#3a1f2a;stroke:#ff8f86;stroke-width:1.4}
.box-muted{fill:none;stroke:#7f93ad;stroke-width:1.2;stroke-dasharray:5 4}
.zone{fill:rgba(224,181,58,.05);stroke:#e0b53a;stroke-width:1.3;stroke-dasharray:6 5}
.t{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#f3f6fb}
.ts{font:500 12px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:#b8c7db}
.cap{font:600 11.5px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:#e0b53a;letter-spacing:.04em}
.ok{fill:#6fd39a}.bad{fill:#ff8f86}.gold{fill:#e0b53a}.dim{fill:#a0aec2}.blue{fill:#9cc0ea}
.ln{stroke:#9cc0ea;stroke-width:1.6;fill:none}
.ln-ok{stroke:#6fd39a;stroke-width:1.6;fill:none}
.ln-bad{stroke:#ff8f86;stroke-width:1.6;fill:none}
.ln-gold{stroke:#e0b53a;stroke-width:1.6;fill:none}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9cc0ea"/></marker>
<marker id="aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fd39a"/></marker>
<marker id="abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff8f86"/></marker>
<marker id="agold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0b53a"/></marker>
</defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-labelledby="t d">
<title id="t">AI-agent AppSec triage context boundary</title>
<desc id="d">Four authored inputs - a synthetic Node.js target, an AppSec policy, SAST results and a brief template - are listed in a context manifest that defines what the AI agent may read. The agent produces a remediation brief and a proposed fix, which go to human review. Work in progress.</desc>

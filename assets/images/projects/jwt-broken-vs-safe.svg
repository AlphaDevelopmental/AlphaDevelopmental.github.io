<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-labelledby="t d">
<title id="t">JWT validation: broken versus safe</title>
<desc id="d">A JWT has three parts: header, payload and signature. A broken server trusts the token without properly verifying it - for example accepting alg none or a weak secret - so a forged token is accepted. A safe server pins the algorithm, verifies the signature and checks expiry, so a forged token is rejected.</desc>
<style>
.bg{fill:#0e1f37}.grid{stroke:#e5edf7;stroke-opacity:.045;stroke-width:1}
.box{fill:#142b4a;stroke:#47658c;stroke-width:1.3}
.box-gold{fill:#142b4a;stroke:#e0b53a;stroke-width:1.5}
.box-ok{fill:#12313a;stroke:#6fd39a;stroke-width:1.4}
.box-bad{fill:#3a1f2a;stroke:#ff8f86;stroke-width:1.4}
.box-muted{fill:none;stroke:#7f93ad;stroke-width:1.2;stroke-dasharray:5 4}
.zone{fill:rgba(224,181,58,.05);stroke:#e0b53a;stroke-width:1.3;stroke-dasharray:6 5}
.t{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#f3f6fb}
.ts{font:500 12px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:#b8c7db}
.cap{font:600 11.5px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:#e0b53a;letter-spacing:.04em}
.ok{fill:#6fd39a}.bad{fill:#ff8f86}.gold{fill:#e0b53a}.dim{fill:#a0aec2}.blue{fill:#9cc0ea}
.ln{stroke:#9cc0ea;stroke-width:1.6;fill:none}
.ln-ok{stroke:#6fd39a;stroke-width:1.6;fill:none}
.ln-bad{stroke:#ff8f86;stroke-width:1.6;fill:none}
.ln-gold{stroke:#e0b53a;stroke-width:1.6;fill:none}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9cc0ea"/></marker>
<marker id="aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fd39a"/></marker>
<marker id="abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff8f86"/></marker>
<marker id="agold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0b53a"/></marker>
</defs>
<rect class="bg" width="480" height="270"/>
<path class="grid" d="M24 0V270"/>
<path class="grid" d="M48 0V270"/>
<path class="grid" d="M72 0V270"/>
<path class="grid" d="M96 0V270"/>
<path class="grid" d="M120 0V270"/>
<path class="grid" d="M144 0V270"/>
<path class="grid" d="M168 0V270"/>
<path class="grid" d="M192 0V270"/>
<path class="grid" d="M216 0V270"/>
<path class="grid" d="M240 0V270"/>
<path class="grid" d="M264 0V270"/>
<path class="grid" d="M288 0V270"/>
<path class="grid" d="M312 0V270"/>
<path class="grid" d="M336 0V270"/>
<path class="grid" d="M360 0V270"/>
<path class="grid" d="M384 0V270"/>
<path class="grid" d="M408 0V270"/>
<path class="grid" d="M432 0V270"/>
<path class="grid" d="M456 0V270"/>
<path class="grid" d="M0 24H480"/>
<path class="grid" d="M0 48H480"/>
<path class="grid" d="M0 72H480"/>
<path class="grid" d="M0 96H480"/>
<path class="grid" d="M0 120H480"/>
<path class="grid" d="M0 144H480"/>
<path class="grid" d="M0 168H480"/>
<path class="grid" d="M0 192H480"/>
<path class="grid" d="M0 216H480"/>
<path class="grid" d="M0 240H480"/>
<path class="grid" d="M0 264H480"/>
<text x="16" y="26" class="cap" text-anchor="start">HEADER . PAYLOAD . SIGNATURE</text>
<rect x="16" y="40" width="136" height="34" rx="6" fill="#3a1f2a" stroke="#ff8f86" stroke-width="1.2"/>
<rect x="160" y="40" width="160" height="34" rx="6" fill="#2b2347" stroke="#c9b5ff" stroke-width="1.2"/>
<rect x="328" y="40" width="136" height="34" rx="6" fill="#12313a" stroke="#6fd39a" stroke-width="1.2"/>
<text x="84" y="62" class="ts" text-anchor="middle" style="fill:#f3f6fb">{&quot;alg&quot;: …}</text>
<text x="240" y="62" class="ts" text-anchor="middle" style="fill:#f3f6fb">{&quot;sub&quot;, &quot;role&quot;, &quot;exp&quot;}</text>
<text x="396" y="62" class="ts" text-anchor="middle" style="fill:#f3f6fb">signature</text>
<text x="16" y="104" class="ts" text-anchor="start" style="fill:#ff8f86">broken</text>
<rect class="box-bad" x="16" y="114" width="268" height="50" rx="8"/>
<text x="150" y="135" class="t" text-anchor="middle">alg: none · weak secret</text>
<text x="150" y="153" class="ts" text-anchor="middle">decoded but not verified</text>
<path class="ln-bad" d="M284 139H318" marker-end="url(#abad)"/>
<rect class="box-bad" x="322" y="114" width="142" height="50" rx="8"/>
<text x="393.0" y="136.0" class="t" text-anchor="middle">forged token</text>
<text x="393.0" y="153.0" class="ts" text-anchor="middle">accepted</text>
<text x="16" y="196" class="ts" text-anchor="start" style="fill:#6fd39a">safe</text>
<rect class="box-ok" x="16" y="206" width="268" height="50" rx="8"/>
<text x="150" y="227" class="t" text-anchor="middle">pin alg · verify signature</text>
<text x="150" y="245" class="ts" text-anchor="middle">check exp before trusting claims</text>
<path class="ln-ok" d="M284 231H318" marker-end="url(#aok)"/>
<rect class="box-ok" x="322" y="206" width="142" height="50" rx="8"/>
<text x="393.0" y="228.0" class="t" text-anchor="middle">forged token</text>
<text x="393.0" y="245.0" class="ts" text-anchor="middle">rejected</text>
</svg>

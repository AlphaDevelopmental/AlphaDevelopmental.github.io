<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="alphaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#12E6A0"/>
    </linearGradient>
    <filter id="alphaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#0c0f14" stroke="url(#alphaGrad)" stroke-width="4" filter="url(#alphaGlow)"/>
  <text x="50" y="68" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="600" fill="url(#alphaGrad)">&#945;</text>
</svg>
